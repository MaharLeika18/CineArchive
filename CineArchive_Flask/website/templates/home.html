                    <img src="https://media.discordapp.net/attachments/1101141739596697601/1370818879881740288/Search.png?ex=6820e211&is=681f9091&hm=07963eb57783d8eaa777d8d571acbd7c335293fc4292a8c102d0ab4610e4c2b2&=&format=webp&quality=lossless&width=625&height=625" alt="search button">

    <!-- Slideshow Section -->
    <section id="slideshow" class="slideshow-container"></section>

<div class="foreground">
  <img
    src="https://media.discordapp.net/attachments/1101141739596697601/1370818880959942786/White.png?ex=68218ad1&is=68203951&hm=1e7d1db5b086604ce4dc28072683c1da14708268f49be5d9e4849625f5efca69&=&format=webp&quality=lossless&width=800&height=800"
    alt="CineArchive Logo"
    class="foreground-logo"
  />
</div>
  <div class="search-container">
    <form class="search-box" action="movie.html" method="GET">
      <input type="text" name="query" placeholder="Search movies..." required>
      <button type="submit">🔍</button>
    </form>
  </div>  

    <footer class="footer">
        <p>© 2025 CineArchive - All rights reserved</p>
    </footer>

    <!-- Search Modal -->
    <div id="search-popup" class="search hidden">
        <div class="search__content">
            <input type="text" id="searchInput" class="search__input" placeholder="Search for films..." />
            <button class="search__btn" onclick="fetchSearchResults()">Search</button>
            <button class="search__btn close" onclick="closeSearch()">Close</button>
            <div id="search-results" class="search__results"></div>
        </div>
    </div>

    <script>
        function openSearch() {
            document.getElementById('search-popup').classList.remove('hidden');
        }

        function closeSearch() {
            document.getElementById('search-popup').classList.add('hidden');
        }

        document.getElementById('searchInput').addEventListener('input', function () {
            const query = this.value.trim();
            if (query) {
                fetchSearchResults(query);
            } else {
                document.getElementById('search-results').innerHTML = '';
            }
        });

        function fetchSearchResults(query = '') {
            if (query.trim() === '') return;

            const token = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI3YjBmZTI2MTRkNDQ3ZTFjNDAwMDBkNmJjYTQwYTZiOCIsIm5iZiI6MS43NDY5MDAzNjQ5ODU5OTk4ZSs5LCJzdWIiOiI2ODFmOTU4Y2QzMzJiZTY0NjRhMTU5Y2UiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.v5oNBG3nwHQkjO4hl62MiH58CLwLHc-3R3ECa2DbyKE';
            const url = `https://api.themoviedb.org/3/search/movie?query=${encodeURIComponent(query)}`;

            fetch(url, {
                headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/json;charset=utf-8'
                }
            })
            .then(response => response.json())
            .then(data => {
                let resultsHtml = '';
                if (data.results && data.results.length > 0) {
                    data.results.forEach(movie => {
                        if (movie.poster_path) {
                            resultsHtml += `
                                <div class="search-result-item" onclick="redirectToMoviePage('${movie.id}')">
                                    <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                                    <span>${movie.title}</span>
                                </div>
                            `;
                        }
                    });
                } else {
                    resultsHtml = '<p>No results found.</p>';
                }
                document.getElementById('search-results').innerHTML = resultsHtml;
            })
            .catch(err => {
                console.error('Error fetching search results:', err);
                document.getElementById('search-results').innerHTML = '<p>There was an error fetching the results.</p>';
            });
        }

        function redirectToMoviePage(movieId) {
            window.location.href = `movie.html?id=${movieId}`;
        }

        // Fetching Popular Movies for Slideshow
        const token = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI3YjBmZTI2MTRkNDQ3ZTFjNDAwMDBkNmJjYTQwYTZiOCIsIm5iZiI6MS43NDY5MDAzNjQ5ODU5OTk4ZSs5LCJzdWIiOiI2ODFmOTU4Y2QzMzJiZTY0NjRhMTU5Y2UiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.v5oNBG3nwHQkjO4hl62MiH58CLwLHc-3R3ECa2DbyKE';
        fetch('https://api.themoviedb.org/3/movie/popular?language=en-US&page=1', {
            headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json;charset=utf-8'
            }
        })
        .then(response => response.json())
        .then(async data => {
            const movies = data.results.slice(0, 5);
            const slideshow = document.getElementById('slideshow');

            for (const movie of movies) {
                const imagesResponse = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}/images`, {
                    headers: {
                        Authorization: `Bearer ${token}`,
                        'Content-Type': 'application/json;charset=utf-8'
                    }
                });

                const imagesData = await imagesResponse.json();
                const logo = imagesData.logos?.find(img => img.iso_639_1 === 'en') || imagesData.logos?.[0];
                const backdropPath = movie.backdrop_path ? `https://image.tmdb.org/t/p/w1280${movie.backdrop_path}` : '';

                const slide = document.createElement('div');
                slide.className = 'slide';

                slide.innerHTML = `
                    <div class="slide-image">
                        <img src="${backdropPath}" alt="${movie.title}" />
                    </div>
                `;

                slideshow.appendChild(slide);
            }

            // Basic slideshow cycling
            let currentSlide = 0;
            const slides = document.querySelectorAll('.slide');
            if (slides.length > 0) slides[0].style.display = 'block';

            setInterval(() => {
                slides[currentSlide].style.display = 'none';
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].style.display = 'block';
            }, 4000);
        })
        .catch(error => {
            console.error('Error loading slideshow:', error);
        });
    </script>

</body>
</html>
