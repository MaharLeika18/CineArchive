<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineArchive - Watchlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #F4963E;
            background-color: #191923;
            display: flex;
            transform-origin: center;
            align-items: center;
            min-height: 100vh;
            min-width: 100vw;
            background-image: url('https://media.discordapp.net/attachments/1130355826683559947/1370391798811197541/Untitled_design_8.png?ex=6822a011&is=68214e91&hm=7116c3923a95115c31a456b11088d5ec0d380adad2f5fb37ce3edd6aa33d9940&=&format=webp&quality=lossless&width=1934&height=1088');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-size: 18px;
        }

        .container {
            max-width: 1700px;
            max-height: 1080px;
            margin: 0 auto;
            padding: 1rem;
            width: 100%;
            padding: 2rem;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(244, 150, 62, 0.2);
            padding-bottom: 1rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(244, 150, 62, 0.5);
            object-fit: cover;
        }

        .site-title {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
        }

        .nav-button:hover {
            color: #F4963E;
        }

        .nav-button-text {
            display: none;
        }

        @media (min-width: 768px) {
            .nav-button-text {
                display: inline;
            }
        }

        main {
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        .subtitle {
            color: #ffffff;
            margin-bottom: 2rem;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 1.5rem;
            position: relative;
        }

        @media (min-width: 640px) {
            .movie-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .movie-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .movie-card {
            background-color: #121212;
            border-radius: 0.5rem;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            color: #F4963E;
        }

        .movie-director {
            color: #ffffff;
            font-size: 0.875rem;
        }

        .movie-director:hover {
            background-color: #F4963E;
            color: #000000;
            font-size: 0.875rem;
            transform: translateY(-5px);
        }

        .movie-card:hover {
            box-shadow: 0 0 0 1px rgba(244, 150, 62, 0.5);
            transform: translateY(-5px);
            background-color: #F4963E;
            box-shadow: 0 0 20px #F4963E;
            color: #000000;
        }

        .movie-poster-container {
            position: relative;
            height: 160px;
            overflow: hidden;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 179, 0, 0.1) 20%, 
                rgba(255, 166, 0, 0.884) 50%,
                rgba(255, 166, 0, 0.1) 80%, 
                transparent 100%);
            box-shadow: 0 0 15px rgba(255, 162, 0, 0.8);
        }

        .movie-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-info {
            padding: 1rem;
        }

        .movie-title {
            font-weight: bold;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        .movie-year {
            color: #F4963E;
            font-size: 0.875rem;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            box-shadow: 0 0 0 1px rgba(244, 150, 62, 0.5);
            transform: translateY(-5px);
            background-color: #F4963E;
            box-shadow: 0 0 20px #F4963E;
            color:rgb(0, 0, 0);
            max-width: 1000px;
            width: 100%;
            border-radius: 0.5rem;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .modal-content {
                flex-direction: row;
            }
        }

        .close-button {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #000000;
            cursor: pointer;
            z-index: 20;
            transition: color 0.3s;
        }

        .close-button:hover {
            color: #fff;
        }

        .modal-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        @media (min-width: 768px) {
            .modal-poster-container {
                width: 50%;
            }
            
            .modal-poster {
                height: 100%;
            }
        }

        .modal-details {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .modal-details {
                width: 50%;
            }
        }

        .modal-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .modal-year {
            color: #000000;
            font-weight: normal;
        }

        .modal-director {
            color: #000000;
        }

        .modal-genres {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .modal-genre {
            font-size: 0.875rem;
            color: #000000;
        }

        .modal-plot {
            color: #000000;
            margin: 1.5rem 0;
            flex-grow: 1;
        }

        .rating-container {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .rating-circle {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            background-color: rgba(244, 150, 62, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
        }

        .rating-value {
            color: #000000;
            font-weight: bold;
            font-size: 30px;
        }

        .rating-source {
            font-size: 0.875rem;
            color: #000000;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .action-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            background: none;
            border: none;
            color: #000000;
            cursor: pointer;
            font-size: 0.75rem;
            transition: color 0.3s;
        }

        .action-button:hover {
            color: #ffffff;
        }

        .action-icon {
            margin-bottom: 0.25rem;
        }

        /* Background circuit lines */
        .circuit-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(90deg, rgba(244, 150, 62, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(244, 150, 62, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
            pointer-events: none;
        }

        /* Glowing particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: rgba(244, 150, 62, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(244, 150, 62, 0.5);
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="circuit-lines"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <header>
            <div class="logo-container">
                <img src="https://media.discordapp.net/attachments/1130355826683559947/1371508556884348968/8.png?ex=68236461&is=682212e1&hm=db2a5c52218194e16dd3d25935cb2d6a9cdf4bd243949a00693549b990628387&=&format=webp&quality=lossless&width=1296&height=1296" alt="CineArchive Logo" class="logo">
                <h2 class="site-title">CineArchive</h2>
            </div>
            <div class="nav-buttons">
                <button class="nav-button" onclick="window.location.href = 'http://127.0.0.1:5000/home'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    <span class="nav-button-text">Home</span>
                </button>
                <button class="nav-button" onclick="window.location.href = 'http://127.0.0.1:5000/login'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    <span class="nav-button-text"><p>Logged in as user #{{ current_user.id }} ({{ current_user.username }})</p></span>
                </button>
        </header>

        <main>
            <h1>Watchlist</h1>
            <p class="subtitle">All your favorite movies in one place</p>

            <div class="movie-grid" id="movie-grid" data-movies='{{ movies|tojson|safe }}'>
                <!-- Movie cards will be inserted here imma leave this one to you Mary XD -->
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <button class="close-button" id="close-modal">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="modal-poster-container">
                <img src="/placeholder.svg" alt="" class="modal-poster" id="modal-poster">
            </div>
            <div class="modal-details">
                <div>
                    <h3 class="modal-title" id="modal-title"></h3>
                    <p class="modal-director" id="modal-director"></p>
                    <div class="modal-genres" id="modal-genres">
                        <!-- Genres will be inserted here -->
                    </div>
                </div>

                <p class="modal-plot" id="modal-plot"></p>

                <div>
                    <div class="rating-container">
                        <div class="rating-circle">
                            <div class="rating-value" id="modal-rating"></div>
                        </div>
                        <div class="rating-source">IMDb</div>
                    </div>

                    <div class="action-buttons">
                        <button class="action-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-icon"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
                            <span>FAV</span>
                        </button>
                        <button class="action-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-icon"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                            <span>DIRECTOR</span>
                        </button>
                        <button class="action-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-icon"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                            <span>INFO</span>
                        </button>
                        <button class="action-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-icon"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
                            <span>TRAILER</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Elements
        const modalOverlay = document.getElementById('modal-overlay');
        const closeModalButton = document.getElementById('close-modal');
        const modalPoster = document.getElementById('modal-poster');
        const modalTitle = document.getElementById('modal-title');
        const modalDirector = document.getElementById('modal-director');
        const modalGenres = document.getElementById('modal-genres');
        const modalPlot = document.getElementById('modal-plot');
        const modalRating = document.getElementById('modal-rating');
        const API_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI3YjBmZTI2MTRkNDQ3ZTFjNDAwMDBkNmJjYTQwYTZiOCIsIm5iZiI6MS43NDY5MDAzNjQ5ODU5OTk4ZSs5LCJzdWIiOiI2ODFmOTU4Y2QzMzJiZTY0NjRhMTU5Y2UiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.v5oNBG3nwHQkjO4hl62MiH58CLwLHc-3R3ECa2DbyKE'; 
        const movieData = document.querySelector(".movie-grid");

        let rawMovies = document.getElementById("movie-grid").dataset.movies;
        let movies = JSON.parse(rawMovies);

        async function fetchAPI(url) {
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        accept: 'application/json',
                        Authorization: `Bearer ${API_TOKEN}`,
                    },
                });
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('API fetch error:', error);
                return null;
            }
        }

        async function fetchPoster(movieId) {
            const url = `https://api.themoviedb.org/3/movie/${movieId}/images`;

            const data = await fetchAPI(url);

            if (data && data.posters?.length > 0) {
                const posterPath = data.posters[0].file_path;
                return `https://image.tmdb.org/t/p/w500${posterPath}`; // Return the full URL for the poster image
            } else {
                return '/static/img/default_poster.png';  // Fallback image if no poster is found
            }
        }

        // Create movie cards
        async function createMovieCards() {
            movieData.innerHTML = '';

            for (const movie of movies) {
                const movieCard = document.createElement('div');
                movieCard.className = 'movie-card';

                const posterUrl = await fetchPoster(movie.id);

                console.log('Directors:', movie.directors);

                movieCard.innerHTML = `
                    <div class="movie-poster-container">
                        <img src="${posterUrl}" alt="${movie.title}" class="movie-poster">
                    </div>
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-meta">
                            <p class="movie-director">${movie.directors}</p>
                            <p class="movie-year">${movie.year || ''}</p>
                        </div>
                    </div>
                `;

                movieCard.addEventListener('click', () => openMovieDetails({
                    ...movie,
                    poster: posterUrl
                }));

                movieData.appendChild(movieCard);
            }
        }

        function openMovieDetails(movie) {
            // Handle missing poster with a fallback
            modalPoster.src = movie.poster || '/static/img/default_poster.png';
            modalPoster.alt = movie.title || 'Movie Poster';

            // title and year
            modalTitle.innerHTML = `${movie.title || 'Untitled'} <span class="modal-year">${movie.year || ''}</span>`;

            const directors = Array.isArray(movie.directors) ? movie.directors : [];
            modalDirector.textContent = directors[0] || 'Unknown';

            modalGenres.innerHTML = '';
            const genres = Array.isArray(movie.genres) ? movie.genres : [];

            genres.forEach((genre, index) => {
                const genreSpan = document.createElement('span');
                genreSpan.className = 'modal-genre';
                genreSpan.textContent = genre + (index < genres.length - 1 ? ' | ' : '');
                modalGenres.appendChild(genreSpan);
            });

            // Plot (description) and rating
            modalPlot.textContent = movie.description || 'No plot available.';
            modalRating.textContent = movie.rating != null ? movie.rating : 'N/A';

            // Show modal
            modalOverlay.classList.add('active');
        }

        // Close movie details modal
        function closeMovieDetails() {
            modalOverlay.classList.remove('active');
        }

        // Event listeners
        closeModalButton.addEventListener('click', closeMovieDetails);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeMovieDetails();
            }
        });

        // Create particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            function createParticle() {
                const particle = document.createElement('div');
                particle.classList.add('particle');

                const posX = Math.random() * window.innerWidth;
                const posY = Math.random() * window.innerHeight + window.innerHeight;

                const size = Math.random() * 3 + 1;

                const duration = Math.random() * 20 + 10;

                const delay = Math.random() * 10;

                particle.style.left = `${posX}px`;
                particle.style.top = `${posY}px`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;

                particlesContainer.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                    createParticle();
                }, (duration + delay) * 1000);
            }

            for (let i = 0; i < particleCount; i++) {
                createParticle();
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            createMovieCards();
            createParticles();
            console.log(movies[0].title);
        });
    </script>
</body>
</html>
